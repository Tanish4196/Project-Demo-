{% extends 'base.html' %}

{% block content %}

<h2>Books</h2>

<table border="1">
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Available</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.available }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
